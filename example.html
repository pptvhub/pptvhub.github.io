<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Video Page</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #000;
    }

    body {
      color: #fff;
    }

    .video-container {
      max-width: 850px;
      margin: 100px auto;
      padding: 0 15px;
      box-sizing: border-box;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
    }

    .video-container video {
      display: block;
      width: 100%;
      border-radius: 8px;
      background: #000;
    }

    /* Tombol Play */
    .custom-play-button {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);

      width: 76px;
      height: 76px;

      border: none;
      border-radius: 50%;

      background: rgba(255, 255, 255, 0.55);

      cursor: pointer;
      z-index: 20;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 0;
      outline: none;

      transition:
        transform 0.2s ease,
        background 0.2s ease;
    }

    .custom-play-button:hover {
      background: rgba(255, 255, 255, 0.75);
      transform: translate(-50%, -50%) scale(1.08);
    }

    .custom-play-button::after {
      content: "";

      margin-left: 5px;

      width: 0;
      height: 0;

      border-top: 13px solid transparent;
      border-bottom: 13px solid transparent;
      border-left: 20px solid #000;
    }

    .custom-play-button.hidden {
      display: none;
    }
  </style>
</head>

<body>

  <main class="video-container">

    <div class="video-wrapper">

      <video
        id="myVideo"
        autoplay
        loop
        playsinline
        controls
        disablePictureInPicture
        controlsList="nodownload noplaybackrate"
      ></video>

      <button
        id="customPlayButton"
        class="custom-play-button"
        aria-label="Play video">
      </button>

    </div>

  </main>


  <script>
    const video = document.getElementById("myVideo");
    const playButton = document.getElementById("customPlayButton");

    const params = new URLSearchParams(location.search);
    const VIDEO_ID = params.get("id");

    if (VIDEO_ID) {

      document.title = VIDEO_ID;

      const base =
        "ht" + "tps://" +
        "cdn." + "videy." + "co/" +
        VIDEO_ID;

      function loadVideo(src) {
        video.src = src;
        video.load();
      }

      loadVideo(`${base}.mp4`);

      video.addEventListener("loadeddata", () => {
        video.play().catch(() => {
          playButton.classList.remove("hidden");
        });
      }, { once: true });


      video.onerror = () => {

        if (!video.dataset.mov) {

          video.dataset.mov = "1";

          loadVideo(`${base}.mov`);

          video.addEventListener("loadeddata", () => {
            video.play().catch(() => {
              playButton.classList.remove("hidden");
            });
          }, { once: true });

        }
      };


      /* Tombol Play */
      playButton.addEventListener("click", function(event) {

        event.preventDefault();
        event.stopPropagation();

        video.play().then(() => {
          playButton.classList.add("hidden");
        }).catch(() => {});

      });


      /* Sembunyikan tombol ketika video mulai */
      video.addEventListener("play", () => {
        playButton.classList.add("hidden");
      });


      /* Tampilkan lagi ketika video dijeda */
      video.addEventListener("pause", () => {

        if (!video.ended) {
          playButton.classList.remove("hidden");
        }

      });


      /* Tampilkan lagi setelah selesai */
      video.addEventListener("ended", () => {
        playButton.classList.remove("hidden");
      });

    } else {

      video.style.display = "none";
      playButton.style.display = "none";

      const message = document.createElement("h2");

      message.textContent = "Video not found";
      message.style.textAlign = "center";

      document
        .querySelector(".video-container")
        .appendChild(message);
    }
  </script>


  <!-- Disable klik kanan -->
  <script>
    document.addEventListener("contextmenu", function(event) {
      event.preventDefault();
    });
  </script>


  <!-- Disable Ctrl + U -->
  <script>
    document.addEventListener("keydown", function(event) {

      if (
        (event.ctrlKey || event.metaKey) &&
        event.key.toLowerCase() === "u"
      ) {
        event.preventDefault();
      }

    });
  </script>


  <!-- Ad -->
  <script>

    const adUrl =
      "https://debutpoignantsudden.com/c79q098me?key=3653cf3b29d1914cd75f69d847f614f4";

    let adOpened = false;


    function openAdOnce() {

      if (adOpened) return;

      adOpened = true;

      const adWindow =
        window.open(
          adUrl,
          "_blank",
          "noopener,noreferrer"
        );

      if (!adWindow) {
        window.location.href = adUrl;
      }

    }


    /*
      Buka iklan ketika user pertama kali
      melakukan klik pada halaman.
    */
    document.addEventListener("click", function(event) {

      if (adOpened) return;

      /*
        Jangan membuka iklan dua kali
        ketika tombol play diklik.
      */
      if (
        event.target === playButton ||
        playButton.contains(event.target)
      ) {
        openAdOnce();
        return;
      }

      openAdOnce();

    }, true);

  </script>
