<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101010">
<title>Watch Video</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#101010;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{display:grid;place-items:center;padding:22px}
.page{width:min(100%,430px);text-align:center}
.brand{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:#aaa;margin-bottom:18px}
.video-card{position:relative;overflow:hidden;width:100%;aspect-ratio:9/16;max-height:76vh;border-radius:12px;background:radial-gradient(ellipse at 50% 35%,#454545 0,#252525 32%,#111 76%);border:1px solid #333;display:grid;place-items:center;cursor:pointer;box-shadow:0 18px 55px #0009}
.video-card:before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#000b,transparent 40%,#0002)}
.play{position:relative;width:76px;height:76px;border-radius:50%;background:#ffffffea;display:grid;place-items:center;box-shadow:0 4px 24px #0008;transition:transform .2s}
.play:after{content:"";margin-left:6px;border-top:15px solid transparent;border-bottom:15px solid transparent;border-left:23px solid #151515}
.video-card:hover .play{transform:scale(1.08)}
.label{position:absolute;bottom:18px;left:16px;right:16px;text-align:left;font-size:13px;color:#fff;background:#0008;padding:10px 12px;border-radius:6px}
h1{font-size:22px;margin:22px 0 8px;font-weight:700}
p{color:#aaa;font-size:14px;line-height:1.5;margin:0}
.note{font-size:11px;color:#777;margin-top:16px}
button{font:inherit}
</style>
</head>
<body>
<main class="page">
  <div class="brand">Video Player</div>
  <button class="video-card" id="playCard" aria-label="Play video" style="padding:0;border:0;color:inherit;text-align:inherit">
    <span class="play" aria-hidden="true"></span>
    <span class="label" id="videoLabel">Tap to play video</span>
  </button>
  <h1 id="heading">Watch Video</h1>
  <p>Tekan tombol play untuk melanjutkan ke pemutar video.</p>
  <div class="note">If playback does not start, tap play again on the player page.</div>
</main>
<script>
(function(){
  const params = new URLSearchParams(location.search);
  const id = params.get('id') || 'JnggqiaU1';
  document.getElementById('videoLabel').textContent = 'Video: ' + id;
  document.getElementById('heading').textContent = 'Watch Video';
  function openPlayer(){
    location.href = 'player.html?mov=' + encodeURIComponent(id);
  }
  document.getElementById('playCard').addEventListener('click', openPlayer);
})();
</script>
</body>
</html>
