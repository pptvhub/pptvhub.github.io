
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Video Page</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    body {
      color: #fff;
    }

    /* Fullscreen Video Container */
    .video-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }

    /* Fullscreen Video */
    .video-container video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      border: 0;
      border-radius: 0;
      background: #000;
    }

    /* Browser Fullscreen Mode */
    .video-container:fullscreen {
      width: 100%;
      height: 100%;
      background: #000;
    }

    .video-container:-webkit-full-screen {
      width: 100%;
      height: 100%;
      background: #000;
    }

    /* Portrait Device */
    @media (orientation: portrait) {
      .video-container video {
        object-fit: contain;
      }
    }

    /* Landscape Device */
    @media (orientation: landscape) {
      .video-container video {
        object-fit: contain;
      }
    }
  </style>
</head>

<body>

  <main class="video-container" id="videoContainer">

    <video
      id="myVideo"
      autoplay
      loop
      playsinline
      controls
      disablePictureInPicture
      controlsList="nodownload noplaybackrate"
    ></video>

  </main>

  <script>
    const video = document.getElementById("myVideo");
    const container = document.getElementById("videoContainer");
    const params = new URLSearchParams(location.search);
    const VIDEO_ID = params.get("id");

    if (VIDEO_ID) {

      document.title = VIDEO_ID;

      const base =
        "ht" + "tps://" +
        "cdn." + "videy." + "co/" +
        VIDEO_ID;

      function loadVideo(src) {
        video.src = src;
        video.load();
      }

      loadVideo(`${base}.mp4`);

      video.addEventListener("loadeddata", () => {
        video.play().catch(() => {});
      }, { once: true });

      video.onerror = () => {

        if (!video.dataset.mov) {

          video.dataset.mov = "1";
          loadVideo(`${base}.mov`);

          video.addEventListener("loadeddata", () => {
            video.play().catch(() => {});
          }, { once: true });

        }
      };

    } else {

      video.style.display = "none";

      const message = document.createElement("h2");
      message.textContent = "Video not found";
      message.style.textAlign = "center";

      message.style.position = "absolute";
      message.style.top = "50%";
      message.style.left = "50%";
      message.style.transform = "translate(-50%, -50%)";

      container.appendChild(message);
    }

    // Fullscreen saat pengguna berinteraksi
    async function enterFullscreen() {
      try {
        if (!document.fullscreenElement) {
          if (container.requestFullscreen) {
            await container.requestFullscreen();
          } else if (container.webkitRequestFullscreen) {
            container.webkitRequestFullscreen();
          }
        }
      } catch (error) {
        console.log("Fullscreen tidak tersedia:", error);
      }
    }

    // Tidak memaksa fullscreen saat halaman dibuka.
    // Pengguna dapat menggunakan kontrol fullscreen browser.
  </script>

  <script>
    document.addEventListener("contextmenu", function(event) {
      event.preventDefault();
    });

    document.addEventListener("keydown", function(event) {
      if (
        (event.ctrlKey || event.metaKey) &&
        event.key.toLowerCase() === "u"
      ) {
        event.preventDefault();
      }
    });
  </script>
