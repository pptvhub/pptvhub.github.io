
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Video Page</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    body {
      color: #fff;
    }

    /* Fullscreen Video Container */
    .video-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }

    /* Responsive Video */
    .video-container video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      border: 0;
      border-radius: 0;
      background: #000;
    }

    /* Banner Advertisement */
    .video-ad {
      display: none;
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: min(728px, calc(100% - 20px));
      min-height: 90px;
      z-index: 20;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.85);
      border-radius: 5px;
      padding: 4px;
    }

    .video-ad.show {
      display: flex;
    }

    .video-ad-content {
      position: relative;
      width: 100%;
      max-width: 728px;
      min-height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .video-ad-content iframe {
      display: block;
      max-width: 100%;
      border: 0;
    }

    /* Close Ad Button */
    .close-ad {
      position: absolute;
      top: 2px;
      right: 2px;
      z-index: 25;
      width: 24px;
      height: 24px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      font-size: 19px;
      line-height: 24px;
      text-align: center;
      cursor: pointer;
    }

    .close-ad:hover {
      background: #e53935;
    }

    /* Fullscreen */
    .video-container:fullscreen {
      width: 100%;
      height: 100%;
      background: #000;
    }

    .video-container:-webkit-full-screen {
      width: 100%;
      height: 100%;
      background: #000;
    }

    /* Mobile */
    @media (max-width: 600px) {
      .video-ad {
        top: 8px;
        width: calc(100% - 16px);
        min-height: 60px;
        padding: 2px;
      }

      .video-ad-content {
        min-height: 60px;
      }

      .video-ad-content iframe {
        max-width: 100%;
      }

      .close-ad {
        width: 21px;
        height: 21px;
        font-size: 16px;
        line-height: 21px;
      }
    }
  </style>
</head>

<body>

  <main class="video-container" id="videoContainer">

    <!-- Video Player -->
    <video
      id="myVideo"
      autoplay
      muted
      loop
      playsinline
      controls
      disablePictureInPicture
      controlsList="nodownload noplaybackrate"
      preload="auto"
    ></video>

    <!-- Advertisement Banner -->
    <div class="video-ad" id="videoAd">
      <div class="video-ad-content" id="videoAdContent"></div>

      <button
        class="close-ad"
        id="closeAd"
        type="button"
        aria-label="Close advertisement"
      >&times;</button>
    </div>

  </main>

  <script>
    const video = document.getElementById("myVideo");
    const container = document.getElementById("videoContainer");
    const videoAd = document.getElementById("videoAd");
    const adContent = document.getElementById("videoAdContent");
    const closeAd = document.getElementById("closeAd");

    const params = new URLSearchParams(location.search);
    const VIDEO_ID = params.get("id");

    let adLoaded = false;
    let adClosed = false;

    // Load video
    if (VIDEO_ID) {

      document.title = VIDEO_ID;

      const base =
        "ht" + "tps://" +
        "cdn." + "videy." + "co/" +
        VIDEO_ID;

      function loadVideo(src) {
        video.src = src;
        video.load();
      }

      function autoPlayVideo() {
        video.muted = true;

        video.play().catch((error) => {
          console.log("Autoplay dibatasi browser:", error);
        });
      }

      video.addEventListener("canplay", autoPlayVideo, {
        once: true
      });

      // Load MP4 first
      loadVideo(`${base}.mp4`);

      // Fallback to MOV
      video.onerror = () => {
        if (!video.dataset.mov) {
          video.dataset.mov = "1";

          video.addEventListener("canplay", autoPlayVideo, {
            once: true
          });

          loadVideo(`${base}.mov`);
        }
      };

    } else {

      video.style.display = "none";

      const message = document.createElement("h2");
      message.textContent = "Video not found";
      message.style.position = "absolute";
      message.style.top = "50%";
      message.style.left = "50%";
      message.style.transform = "translate(-50%, -50%)";
      message.style.textAlign = "center";

      container.appendChild(message);
    }

    // Load advertisement once
    function showVideoAd() {
      if (adLoaded || adClosed) return;

      adLoaded = true;

      // Ad configuration
      window.atOptions = {
        'key': 'e6af704cca4869862647f98f0613b97a',
        'format': 'iframe',
        'height': 90,
        'width': 728,
        'params': {}
      };

      // Display banner
      videoAd.classList.add("show");

      // Load ad script
      const adScript = document.createElement("script");
      adScript.src =
        "https://biomanos.org/22/e6af704cca4869862647f98f0613b97a";
      adScript.async = true;

      adContent.appendChild(adScript);
    }

    // Show ad after video reaches 17 seconds
    video.addEventListener("timeupdate", function() {
      if (video.currentTime >= 17) {
        showVideoAd();
      }
    });

    // Close advertisement
    closeAd.addEventListener("click", function(event) {
      event.preventDefault();
      event.stopPropagation();

      adClosed = true;
      videoAd.classList.remove("show");
    });

    // Fullscreen on user interaction, if required
    async function enterFullscreen() {
      try {
        if (!document.fullscreenElement) {
          if (container.requestFullscreen) {
            await container.requestFullscreen();
          } else if (container.webkitRequestFullscreen) {
            container.webkitRequestFullscreen();
          }
        }
      } catch (error) {
        console.log("Fullscreen tidak tersedia:", error);
      }
    }
  </script>

  <!-- Disable Context Menu -->
  <script>
    document.addEventListener("contextmenu", function(event) {
      event.preventDefault();
    });
  </script>

  <!-- Disable Ctrl+U -->
  <script>
    document.addEventListener("keydown", function(event) {
      if (
        (event.ctrlKey || event.metaKey) &&
        event.key.toLowerCase() === "u"
      ) {
        event.preventDefault();
      }
    });
  </script>
