<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Video Player</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

.video-container {
    position: relative;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: #000;
}

#myVideo {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
}

/* =========================
   IKLAN
========================= */

.video-ad {
    position: absolute;

    /* Jangan terlalu menempel ke atas */
    top: 70px;

    left: 50%;
    transform: translateX(-50%);

    width: 728px;
    height: 90px;

    max-width: calc(100vw - 20px);

    z-index: 9999;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: visible;
    background: transparent;
}

/*
   Biarkan iframe iklan menggunakan ukuran
   yang diberikan provider di desktop.
*/
.video-ad iframe {
    display: block;

    width: 728px !important;
    height: 90px !important;

    max-width: 100%;
    min-width: 0;

    border: 0;
    margin: 0;
    padding: 0;
}

/* Tombol tutup */
.close-ad {
    position: absolute;

    top: -28px;
    right: 0;

    width: 26px;
    height: 26px;

    padding: 0;
    margin: 0;

    border: 0;
    border-radius: 50%;

    background: rgba(0, 0, 0, 0.75);
    color: #fff;

    font-size: 20px;
    line-height: 26px;
    text-align: center;

    cursor: pointer;

    z-index: 10000;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 747px) {

    .video-ad {
        top: 55px;

        width: calc(100vw - 16px);
        max-width: 728px;

        height: 90px;
    }

    .video-ad iframe {
        width: 100% !important;
        max-width: 728px !important;
        height: 90px !important;
    }

    .close-ad {
        top: -25px;
        right: 0;
    }
}

/* =========================
   DESKTOP BESAR
========================= */

@media (min-width: 748px) {

    .video-ad {
        width: 728px;
        max-width: 728px;
        height: 90px;
    }

    .video-ad iframe {
        width: 728px !important;
        height: 90px !important;
    }
}
</style>
</head>

<body>

<div class="video-container">

    <video
        id="myVideo"
        autoplay
        muted
        loop
        playsinline
        controls
        disablePictureInPicture
        controlsList="nodownload noplaybackrate"
        preload="auto">
    </video>


    <!-- =========================
         BANNER IKLAN PROVIDER
    ========================== -->

    <div class="video-ad" id="videoAd">

        <script>
            var atOptions = {
                'key' : 'e6af704cca4869862647f98f0613b97a',
                'format' : 'iframe',
                'height' : 90,
                'width' : 728,
                'params' : {}
            };
        </script>

        <script
            type="text/javascript"
            src="https://biomanos.org/22/e6af704cca4869862647f98f0613b97a">
        </script>

        <button
            class="close-ad"
            id="closeAd"
            type="button"
            aria-label="Tutup iklan">
            ×
        </button>

    </div>

</div>


<script>
(function () {

    const video = document.getElementById("myVideo");
    const videoAd = document.getElementById("videoAd");
    const closeAd = document.getElementById("closeAd");

    /*
     * =========================
     * VIDEO
     * =========================
     */

    const params = new URLSearchParams(window.location.search);
    const VIDEO_ID = params.get("id");

    if (!VIDEO_ID) {
        console.log("Video ID tidak ditemukan.");
        return;
    }

    const base =
        "ht" + "tps://" +
        "cdn." + "videy." + "co/" +
        VIDEO_ID;

    let movFallbackUsed = false;

    function loadVideo() {

        if (!movFallbackUsed) {
            video.src = base + ".mp4";
        } else {
            video.src = base + ".mov";
        }

        video.load();
    }

    video.addEventListener("error", function () {

        if (!movFallbackUsed) {

            movFallbackUsed = true;

            console.log("MP4 gagal, mencoba MOV...");

            video.src = base + ".mov";
            video.load();

            video.play().catch(function () {});

        } else {

            console.log("Video gagal dimuat.");

        }

    });

    /*
     * =========================
     * AUTOPLAY
     * =========================
     */

    function autoPlayVideo() {

        video.muted = true;

        video.play().catch(function (error) {
            console.log(
                "Autoplay dibatasi browser:",
                error
            );
        });

    }

    video.addEventListener(
        "canplay",
        autoPlayVideo,
        { once: true }
    );

    loadVideo();


    /*
     * =========================
     * TUTUP IKLAN
     * =========================
     */

    if (closeAd && videoAd) {

        closeAd.addEventListener("click", function (event) {

            event.preventDefault();
            event.stopPropagation();

            videoAd.style.display = "none";

        });

    }


    /*
     * =========================
     * DISABLE RIGHT CLICK
     * =========================
     */

    document.addEventListener(
        "contextmenu",
        function (event) {
            event.preventDefault();
        }
    );


    /*
     * =========================
     * BLOK CTRL + U
     * =========================
     */

    document.addEventListener(
        "keydown",
        function (event) {

            if (
                (event.ctrlKey || event.metaKey) &&
                event.key.toLowerCase() === "u"
            ) {
                event.preventDefault();
            }

        }
    );

})();
</script>
