<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Video Player</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
    }

    body {
      font-family: Arial, sans-serif;
    }

    /* =========================
       VIDEO CONTAINER
    ========================= */

    .video-container {
      position: relative;

      width: 100vw;
      height: 100vh;
      height: 100dvh;

      margin: 0;
      padding: 0;

      background: #000;

      overflow: hidden;
    }

    /* =========================
       VIDEO
    ========================= */

    #myVideo {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: contain;

      background: #000;
    }

    /* =========================
       BANNER IKLAN
    ========================= */

    .video-ad {
      position: absolute;

      top: 10px;
      left: 50%;

      transform: translateX(-50%);

      width: min(728px, calc(100% - 20px));
      min-height: 90px;

      display: flex;
      justify-content: center;
      align-items: flex-start;

      z-index: 20;

      overflow: visible;
    }

    /*
      Script tidak perlu terlihat sebagai
      elemen visual. Script provider akan
      membuat iframe iklannya sendiri.
    */
    .video-ad > script {
      display: none;
    }

    /* =========================
       CLOSE BUTTON
    ========================= */

    .close-ad {
      position: absolute;

      top: -25px;
      right: 0;

      width: 24px;
      height: 24px;

      padding: 0;

      border: none;
      border-radius: 50%;

      background: rgba(0, 0, 0, 0.75);
      color: #fff;

      font-size: 18px;
      line-height: 24px;

      text-align: center;

      cursor: pointer;

      z-index: 30;
    }

    .close-ad:hover {
      background: rgba(0, 0, 0, 0.95);
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {
      .video-ad {
        top: 8px;

        width: calc(100% - 16px);
        min-height: 60px;
      }

      .close-ad {
        top: -24px;
        right: 0;

        width: 22px;
        height: 22px;

        font-size: 16px;
        line-height: 22px;
      }
    }
  </style>
</head>

<body>

  <div class="video-container">

    <!-- =========================
         VIDEO PLAYER
    ========================== -->

    <video
      id="myVideo"
      autoplay
      muted
      loop
      playsinline
      controls
      disablePictureInPicture
      controlsList="nodownload noplaybackrate"
      preload="auto"
    ></video>


    <!-- =========================
         BANNER IKLAN
         SNIPPET PROVIDER LANGSUNG
    ========================== -->

    <div class="video-ad" id="videoAd">

      <script>
        atOptions = {
          'key' : 'e6af704cca4869862647f98f0613b97a',
          'format' : 'iframe',
          'height' : 90,
          'width' : 728,
          'params' : {}
        };
      </script>

      <script
        type="text/javascript"
        src="https://biomanos.org/22/e6af704cca4869862647f98f0613b97a">
      </script>

      <button
        class="close-ad"
        id="closeAd"
        type="button"
        aria-label="Tutup iklan"
      >
        ×
      </button>

    </div>

  </div>


  <!-- =========================
       VIDEO SCRIPT
  ========================== -->

  <script>
    const video = document.getElementById("myVideo");

    /*
      Ambil ID video dari:
      ?id=VIDEO_ID
    */

    const params = new URLSearchParams(window.location.search);
    const VIDEO_ID = params.get("id");


    /*
      Kalau ID tidak ditemukan,
      player tidak akan mencoba
      memuat video yang tidak valid.
    */

    if (!VIDEO_ID) {

      console.error("Video ID tidak ditemukan.");

    } else {

      /*
        Membentuk URL video.
      */

      const base =
        "ht" + "tps://" +
        "cdn." + "videy." + "co/" +
        VIDEO_ID;


      /*
        Prioritas pertama: MP4
      */

      video.src = base + ".mp4";


      /*
        Jika MP4 gagal,
        coba MOV satu kali.
      */

      let fallbackUsed = false;

      video.addEventListener("error", function () {

        if (!fallbackUsed) {

          fallbackUsed = true;

          console.log("MP4 gagal, mencoba MOV...");

          video.src = base + ".mov";

          video.load();

          video.play().catch(function (error) {
            console.log(
              "Autoplay dibatasi browser:",
              error
            );
          });
        }

      });


      /*
        Autoplay.
        Muted diperlukan oleh banyak browser
        agar autoplay dapat berjalan.
      */

      function autoPlayVideo() {

        video.muted = true;

        video.play().catch(function (error) {

          console.log(
            "Autoplay dibatasi browser:",
            error
          );

        });

      }


      /*
        Coba autoplay ketika video
        sudah dapat diputar.
      */

      video.addEventListener(
        "canplay",
        autoPlayVideo,
        { once: true }
      );


      /*
        Fallback tambahan setelah
        metadata video tersedia.
      */

      video.addEventListener(
        "loadedmetadata",
        function () {

          video.muted = true;

          video.play().catch(function (error) {

            console.log(
              "Autoplay dibatasi browser:",
              error
            );

          });

        },
        { once: true }
      );

    }


    /* =========================
       CLOSE BANNER
    ========================== */

    const closeAd =
      document.getElementById("closeAd");

    const videoAd =
      document.getElementById("videoAd");


    closeAd.addEventListener(
      "click",
      function () {

        videoAd.style.display = "none";

      }
    );


    /* =========================
       DISABLE RIGHT CLICK
    ========================== */

    document.addEventListener(
      "contextmenu",
      function (event) {

        event.preventDefault();

      }
    );


    /* =========================
       BLOKIR CTRL + U
    ========================== */

    document.addEventListener(
      "keydown",
      function (event) {

        if (
          event.ctrlKey &&
          event.key.toLowerCase() === "u"
        ) {

          event.preventDefault();

        }

      }
    );
  </script>
