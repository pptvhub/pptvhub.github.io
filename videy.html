<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Player</title>

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
    }

    .video-container {
        position: relative;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        background: #000;
    }

    #myVideo {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
    }

    /* Slot iklan 728x90 */
    .ad-container {
        position: absolute;
        top: 70px;
        left: 50%;
        transform: translateX(-50%);
        width: 728px;
        height: 90px;
        max-width: calc(100vw - 20px);
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: visible;
    }

    .ad-container iframe {
        display: block;
        width: 728px !important;
        height: 90px !important;
        max-width: 100%;
        border: 0;
    }

    @media (max-width: 747px) {
        .ad-container {
            top: 55px;
            width: calc(100vw - 16px);
            height: 90px;
        }

        .ad-container iframe {
            width: 100% !important;
            height: 90px !important;
        }
    }
</style>
</head>

<body>

<div class="video-container">

    <video
        id="myVideo"
        autoplay
        muted
        loop
        playsinline
        controls
        disablePictureInPicture
        controlsList="nodownload noplaybackrate"
        preload="auto">
    </video>

    <!-- Iklan provider -->
    <div class="ad-container">
        <script>
            var atOptions = {
                'key': 'e6af704cca4869862647f98f0613b97a',
                'format': 'iframe',
                'height': 90,
                'width': 728,
                'params': {}
            };
        </script>
        <script
            type="text/javascript"
            src="https://biomanos.org/22/e6af704cca4869862647f98f0613b97a">
        </script>
    </div>

</div>

<script>
    const video = document.getElementById("myVideo");

    // Ambil ID video dari URL ?id=
    const params = new URLSearchParams(window.location.search);
    const VIDEO_ID = params.get("id");

    if (VIDEO_ID) {
        const base =
            "ht" + "tps://" +
            "cdn." + "videy." + "co/" +
            VIDEO_ID;

        // Coba MP4 terlebih dahulu
        video.src = base + ".mp4";

        // Jika MP4 gagal, coba MOV sekali
        video.addEventListener("error", function handleError() {
            if (!video.dataset.fallback) {
                video.dataset.fallback = "1";
                video.src = base + ".mov";
                video.load();
                autoPlayVideo();
            }
        }, { once: true });

        video.load();
    }

    // Autoplay muted
    function autoPlayVideo() {
        video.muted = true;

        video.play().catch(function(error) {
            console.log("Autoplay dibatasi browser:", error);
        });
    }

    video.addEventListener("canplay", autoPlayVideo, { once: true });

    // Blokir menu klik kanan
    document.addEventListener("contextmenu", function(event) {
        event.preventDefault();
    });

    // Blokir Ctrl+U
    document.addEventListener("keydown", function(event) {
        if (
            event.ctrlKey &&
            (event.key === "u" || event.key === "U")
        ) {
            event.preventDefault();
        }
    });
</script>
