<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Video Player</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

.video-container {
    position: relative;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: #000;
}

#myVideo {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
}
</style>
</head>

<body>

<div class="video-container">

    <video
        id="myVideo"
        autoplay
        muted
        loop
        playsinline
        controls
        disablePictureInPicture
        controlsList="nodownload noplaybackrate"
        preload="auto">
    </video>

</div>

<script>
  atOptions = {
    'key' : 'e6af704cca4869862647f98f0613b97a',
    'format' : 'iframe',
    'height' : 90,
    'width' : 728,
    'params' : {}
  };
</script>
<script src="https://biomanos.org/22/e6af704cca4869862647f98f0613b97a"></script>

<script>
(function () {

    const video = document.getElementById("myVideo");

    /*
     * =========================
     * VIDEO ID
     * =========================
     */

    const params = new URLSearchParams(window.location.search);
    const VIDEO_ID = params.get("id");

    if (!VIDEO_ID) {
        console.log("Video ID tidak ditemukan.");
        return;
    }


    /*
     * =========================
     * VIDEO URL
     * =========================
     */

    const base =
        "ht" + "tps://" +
        "cdn." + "videy." + "co/" +
        VIDEO_ID;


    let movFallbackUsed = false;


    function loadVideo() {

        if (!movFallbackUsed) {
            video.src = base + ".mp4";
        } else {
            video.src = base + ".mov";
        }

        video.load();
    }


    /*
     * =========================
     * FALLBACK MP4 → MOV
     * =========================
     */

    video.addEventListener("error", function () {

        if (!movFallbackUsed) {

            movFallbackUsed = true;

            console.log("MP4 gagal, mencoba MOV...");

            video.src = base + ".mov";
            video.load();

            video.play().catch(function () {});

        } else {

            console.log("Video gagal dimuat.");

        }

    });


    /*
     * =========================
     * AUTOPLAY
     * =========================
     */

    function autoPlayVideo() {

        video.muted = true;

        video.play().catch(function (error) {

            console.log(
                "Autoplay dibatasi browser:",
                error
            );

        });

    }


    video.addEventListener(
        "canplay",
        autoPlayVideo,
        { once: true }
    );


    loadVideo();


    /*
     * =========================
     * DISABLE RIGHT CLICK
     * =========================
     */

    document.addEventListener(
        "contextmenu",
        function (event) {
            event.preventDefault();
        }
    );


    /*
     * =========================
     * BLOK CTRL + U
     * =========================
     */

    document.addEventListener(
        "keydown",
        function (event) {

            if (
                (event.ctrlKey || event.metaKey) &&
                event.key.toLowerCase() === "u"
            ) {
                event.preventDefault();
            }

        }
    );

})();
</script>
