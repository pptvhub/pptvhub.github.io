<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Video Page</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    body {
      color: #fff;
    }

    /* =========================================
       FULLSCREEN VIDEO CONTAINER
       ========================================= */

    .video-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }

    /* =========================================
       VIDEO PLAYER
       ========================================= */

    .video-container video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      border: 0;
      border-radius: 0;
      background: #000;
    }

    /* =========================================
       VIDEO ADVERTISEMENT
       Posisi: Atas di dalam video
       ========================================= */

    .video-ad {
      display: none;

      position: absolute;

      top: 10px;
      left: 50%;

      transform: translateX(-50%);

      width: min(728px, calc(100% - 20px));

      min-height: 90px;

      z-index: 20;

      background: transparent;
    }

    .video-ad.show {
      display: block;
    }

    /*
      Container untuk kode iklan
    */

    .video-ad-code {
      width: 100%;
      min-height: 90px;

      display: flex;
      justify-content: center;
      align-items: center;

      overflow: hidden;
    }

    /*
      Pastikan iframe yang dibuat
      jaringan iklan tidak melebihi player
    */

    .video-ad-code iframe {
      display: block;

      max-width: 100%;

      border: 0;
    }

    /* =========================================
       CLOSE BUTTON
       ========================================= */

    .close-ad {
      position: absolute;

      top: -25px;
      right: 0;

      z-index: 30;

      width: 24px;
      height: 24px;

      padding: 0;

      border: 0;
      border-radius: 50%;

      background: rgba(0, 0, 0, 0.85);

      color: #fff;

      font-size: 18px;
      line-height: 24px;

      text-align: center;

      cursor: pointer;
    }

    .close-ad:hover {
      background: rgba(220, 0, 0, 0.9);
    }

    /* =========================================
       FULLSCREEN API
       ========================================= */

    .video-container:fullscreen {
      width: 100%;
      height: 100%;
      background: #000;
    }

    .video-container:-webkit-full-screen {
      width: 100%;
      height: 100%;
      background: #000;
    }

    /* =========================================
       MOBILE
       ========================================= */

    @media (max-width: 600px) {

      .video-ad {
        top: 8px;

        width: calc(100% - 16px);

        min-height: 60px;
      }

      .video-ad-code {
        min-height: 60px;
      }

      .video-ad-code iframe {
        max-width: 100%;
      }

      .close-ad {
        top: -23px;

        width: 21px;
        height: 21px;

        font-size: 16px;
        line-height: 21px;
      }
    }

    /* =========================================
       VERY SMALL MOBILE
       ========================================= */

    @media (max-width: 360px) {

      .video-ad {
        width: calc(100% - 10px);
        top: 5px;
      }

      .video-ad-code {
        min-height: 50px;
      }
    }
  </style>
</head>


<body>

  <!-- =========================================
       VIDEO PLAYER
       ========================================= -->

  <main
    class="video-container"
    id="videoContainer"
  >

    <video
      id="myVideo"
      autoplay
      muted
      loop
      playsinline
      controls
      disablePictureInPicture
      controlsList="nodownload noplaybackrate"
      preload="auto"
    ></video>


    <!-- =========================================
         ADVERTISEMENT
         Muncul setelah 17 detik
         ========================================= -->

    <div
      class="video-ad"
      id="videoAd"
    >

      <!-- Kode iklan akan dimasukkan di sini -->
      <div
        class="video-ad-code"
        id="videoAdCode"
      ></div>


      <!-- Close Advertisement -->
      <button
        class="close-ad"
        id="closeAd"
        type="button"
        aria-label="Close advertisement"
      >
        &times;
      </button>

    </div>

  </main>


  <!-- =========================================
       VIDEO SCRIPT
       ========================================= -->

  <script>

    const video =
      document.getElementById("myVideo");

    const container =
      document.getElementById("videoContainer");

    const params =
      new URLSearchParams(location.search);

    const VIDEO_ID =
      params.get("id");


    /*
     * =========================================
     * LOAD VIDEO
     * =========================================
     */

    if (VIDEO_ID) {

      document.title = VIDEO_ID;


      const base =
        "ht" + "tps://" +
        "cdn." + "videy." + "co/" +
        VIDEO_ID;


      function loadVideo(src) {

        video.src = src;

        video.load();

      }


      /*
       * =======================================
       * AUTOPLAY
       * =======================================
       */

      function autoPlayVideo() {

        video.muted = true;

        video.play().catch(function(error) {

          console.log(
            "Autoplay dibatasi browser:",
            error
          );

        });

      }


      /*
       * Tunggu sampai video siap
       */

      video.addEventListener(
        "canplay",
        autoPlayVideo,
        {
          once: true
        }
      );


      /*
       * Coba MP4 terlebih dahulu
       */

      loadVideo(
        `${base}.mp4`
      );


      /*
       * =======================================
       * FALLBACK MOV
       * =======================================
       */

      video.onerror = function() {

        if (!video.dataset.mov) {

          video.dataset.mov = "1";


          video.addEventListener(
            "canplay",
            autoPlayVideo,
            {
              once: true
            }
          );


          loadVideo(
            `${base}.mov`
          );

        }

      };


    } else {

      /*
       * =======================================
       * VIDEO ID TIDAK ADA
       * =======================================
       */

      video.style.display = "none";


      const message =
        document.createElement("h2");


      message.textContent =
        "Video not found";


      message.style.position =
        "absolute";

      message.style.top =
        "50%";

      message.style.left =
        "50%";

      message.style.transform =
        "translate(-50%, -50%)";

      message.style.textAlign =
        "center";

      message.style.width =
        "100%";


      container.appendChild(
        message
      );

    }

  </script>


  <!-- =========================================
       VIDEO AD SCRIPT
       ========================================= -->

  <script>

    const videoAd =
      document.getElementById("videoAd");

    const videoAdCode =
      document.getElementById("videoAdCode");

    const closeAd =
      document.getElementById("closeAd");


    /*
     * Status iklan
     */

    let adShown = false;

    let adClosed = false;


    /*
     * =========================================
     * SHOW AD
     * =========================================
     */

    function showVideoAd() {

      /*
       * Jangan load iklan lebih dari sekali
       */

      if (
        adShown ||
        adClosed
      ) {
        return;
      }


      adShown = true;


      /*
       * Tampilkan container iklan
       */

      videoAd.classList.add("show");


      /*
       * =======================================
       * AT OPTIONS
       * =======================================
       *
       * Ini menggunakan data iklan kamu,
       * bukan contoh dari screenshot.
       */

      window.atOptions = {

        'key':
          'e6af704cca4869862647f98f0613b97a',

        'format':
          'iframe',

        'height':
          90,

        'width':
          728,

        'params':
          {}

      };


      /*
       * =======================================
       * LOAD SCRIPT IKLAN
       * =======================================
       */

      const adScript =
        document.createElement("script");


      adScript.type =
        "text/javascript";


      adScript.src =
        "https://biomanos.org/22/e6af704cca4869862647f98f0613b97a";


      /*
       * Masukkan script ke container iklan
       */

      videoAdCode.appendChild(
        adScript
      );

    }


    /*
     * =========================================
     * TAMPILKAN IKLAN PADA DETIK 10
     * =========================================
     *
     * timeupdate mengikuti waktu pemutaran video.
     */

    video.addEventListener(
      "timeupdate",
      function() {

        if (
          !adShown &&
          !adClosed &&
          video.currentTime >= 10
        ) {

          showVideoAd();

        }

      }
    );


    /*
     * =========================================
     * CLOSE AD
     * =========================================
     */

    closeAd.addEventListener(
      "click",
      function(event) {

        event.preventDefault();

        event.stopPropagation();


        adClosed = true;


        videoAd.classList.remove(
          "show"
        );

      }
    );

  </script>


  <!-- =========================================
       DISABLE CONTEXT MENU
       ========================================= -->

  <script>

    document.addEventListener(
      "contextmenu",
      function(event) {

        event.preventDefault();

      }
    );

  </script>


  <!-- =========================================
       DISABLE CTRL + U
       ========================================= -->

  <script>

    document.addEventListener(
      "keydown",
      function(event) {

        if (
          (event.ctrlKey || event.metaKey) &&
          event.key.toLowerCase() === "u"
        ) {

          event.preventDefault();

        }

      }
    );

  </script>
