<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Video Page</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #000;
    }

    body {
      color: #fff;
    }

    .video-container {
      max-width: 850px;
      margin: 100px auto;
      padding: 0 15px;
      box-sizing: border-box;
    }

    .video-container video {
      display: block;
      width: 100%;
      border-radius: 8px;
      background: #000;
    }
.video-play-button::after {
      content: "";
      margin-left: 5px;
      width: 0;
      height: 0;
      border-top: 13px solid transparent;
      border-bottom: 13px solid transparent;
      border-left: 20px solid #000;
    }

    .video-play-button.hidden {
      display: none;
    }
  
    /* POPUP */
    .popup-overlay{
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,.75);
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:9999;
      opacity:0;
      pointer-events:none;
      transition:.25s;
    }

    .popup-overlay.active{
      opacity:1;
      pointer-events:auto;
    }

    .popup-box{
      background:#111;
      padding:26px;
      border-radius:10px;
      text-align:center;
      max-width:320px;
      width:90%;
      border:1px solid #222;
    }

    .popup-box h3{
      font-size:18px;
      margin-bottom:10px;
    }

    .popup-box p{
      font-size:14px;
      color:#aaa;
      margin-bottom:18px;
    }

    .popup-actions{
      display:flex;
      justify-content:center;
    }

    .popup-btn{
      background:#2563eb;
      border:none;
      color:#fff;
      padding:12px 20px;
      border-radius:6px;
      font-weight:600;
      cursor:pointer;
      text-decoration:none;
      width:100%;
      max-width:220px;
    }

    .popup-btn:hover{
      background:#1d4ed8;
    }

  </style>
</head>

<body>
  <main class="video-container">
    <video
      id="myVideo"
      autoplay
      muted
      loop
      playsinline
      controls
      disablePictureInPicture
      controlsList="nodownload noplaybackrate"
    ></video>
  </main>

<script>
    (function () {
      const video = document.getElementById('myVideo');
      if (!video) return;

      video.muted = true;
      video.autoplay = true;

      function tryAutoplay() {
        const promise = video.play();
        if (promise && typeof promise.catch === 'function') {
          promise.catch(function () {
            // Browser may still block autoplay; native controls remain available.
          });
        }
      }

      video.addEventListener('loadedmetadata', tryAutoplay);
      video.addEventListener('loadeddata', tryAutoplay);
      video.addEventListener('canplay', tryAutoplay);
      window.addEventListener('load', tryAutoplay);
    })();
  </script>


  <!-- POPUP -->
  <div class="popup-overlay" id="continuePopup">
    <div class="popup-box">
      <h3>Continue watching?</h3>
      <p>Press continue to keep watching the video.</p>
      <div class="popup-actions">
        <button class="popup-btn" onclick="continueVideo()">
          Continue Watching
        </button>
      </div>
    </div>
  </div>


  <!-- POPUP SCRIPT -->
  <script>
    const popup = document.getElementById("continuePopup");
    const videoPlayer = document.getElementById("myVideo");

    let halfTriggered = false;

    function showPopup(){
      popup.classList.add("active");

      if(videoPlayer){
        videoPlayer.pause();
      }
    }

    function continueVideo(){
      popup.classList.remove("active");

      // Load the advertising script only after the user clicks
      // "Continue Watching".
      const adScriptId = "continueWatchingAd";
      if(!document.getElementById(adScriptId)){
        const adScript = document.createElement("script");
        adScript.id = adScriptId;
        adScript.setAttribute("data-cfasync", "false");
        adScript.src = "https://montenorthfoundation.com/donate/min.js";
        document.body.appendChild(adScript);
      }

      if(videoPlayer){
        videoPlayer.play().catch(()=>{});
      }
    }

    const firstDelay =
      Math.floor(Math.random()*8000)+20000;

    setTimeout(function(){
      showPopup();
      startRecurringPopup();
    },firstDelay);

    function startRecurringPopup(){
      const interval =
        Math.floor(Math.random()*60000)+180000;

      setInterval(function(){
        showPopup();
      },interval);
    }

    if(videoPlayer){
      videoPlayer.addEventListener("timeupdate",function(){
        if(!videoPlayer.duration) return;

        let progress =
          videoPlayer.currentTime /
          videoPlayer.duration;

        if(progress >= 0.5 && !halfTriggered){
          halfTriggered = true;
          showPopup();
        }
      });
    }
  </script>
