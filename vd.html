<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Video Page</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #000;
    }

    body {
      color: #fff;
    }

    .video-container {
      max-width: 850px;
      margin: 100px auto;
      padding: 0 15px;
      box-sizing: border-box;
    }

    .video-container video {
      display: block;
      width: 100%;
      border-radius: 8px;
      background: #000;
    }

    .video-play-button {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 76px;
      height: 76px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.55);
      cursor: pointer;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .video-play-button:hover {
      background: rgba(255, 255, 255, 0.7);
    }

    .video-play-button::after {
      content: "";
      margin-left: 5px;
      width: 0;
      height: 0;
      border-top: 13px solid transparent;
      border-bottom: 13px solid transparent;
      border-left: 20px solid #000;
    }

    .video-play-button.hidden {
      display: none;
    }
  </style>
</head>

<body>
  <main class="video-container">
    <video
      id="myVideo"
      autoplay
      loop
      playsinline
      controls
      disablePictureInPicture
      controlsList="nodownload noplaybackrate"
    ></video>

    <button
      id="videoPlayButton"
      class="video-play-button"
      aria-label="Play video">
    </button>
  </main>
