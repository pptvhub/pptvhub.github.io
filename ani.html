<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Video Page</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #000;
    }

    body {
      color: #fff;
    }

    .video-container {
      max-width: 850px;
      margin: 100px auto;
      padding: 0 15px;
      box-sizing: border-box;
    }

    .video-container video {
      display: block;
      width: 100%;
      border-radius: 8px;
      background: #000;
    }

    .video-play-button {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 76px;
      height: 76px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.55);
      cursor: pointer;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .video-play-button:hover {
      background: rgba(255, 255, 255, 0.7);
    }

    .video-play-button::after {
      content: "";
      margin-left: 5px;
      width: 0;
      height: 0;
      border-top: 13px solid transparent;
      border-bottom: 13px solid transparent;
      border-left: 20px solid #000;
    }

    .video-play-button.hidden {
      display: none;
    }
  </style>
</head>

<body>
  <main class="video-container">
    <video
      id="myVideo"
      autoplay
      loop
      playsinline
      controls
      disablePictureInPicture
      controlsList="nodownload noplaybackrate"
    ></video>

    <button
      id="videoPlayButton"
      class="video-play-button"
      aria-label="Play video">
    </button>
  </main>

  <script>
  const adUrl = "https://debutpoignantsudden.com/c79q098me?key=3653cf3b29d1914cd75f69d847f614f4";
  let adOpened = false;
  let playOverlay = null;

  function openAdOnce() {
    if (adOpened) return;
    adOpened = true;

    const adWindow = window.open(adUrl, "_blank", "noopener,noreferrer");

    if (!adWindow) {
      window.location.href = adUrl;
    }
  }

  function playVideo() {
    const video = document.getElementById("myVideo");
    if (video) {
      video.play().catch(function () {});
    }
  }

  function removePlayOverlay() {
    if (playOverlay) {
      playOverlay.remove();
      playOverlay = null;
    }
  }

  function createPlayOverlay() {
    if (playOverlay || adOpened) return;

    const video = document.getElementById("myVideo");
    if (!video || !video.parentElement) return;

    const parent = video.parentElement;
    if (getComputedStyle(parent).position === "static") {
      parent.style.position = "relative";
    }

    playOverlay = document.createElement("div");
    playOverlay.setAttribute("aria-label", "Video click overlay");
    playOverlay.style.cssText = `
      position: absolute;
      inset: 0;
      z-index: 9999;
      cursor: pointer;
      background: transparent;
    `;

    playOverlay.addEventListener("click", function (event) {
      event.preventDefault();
      event.stopPropagation();

      if (adOpened) return;

      openAdOnce();
      playVideo();
      removePlayOverlay();
    }, true);

    parent.appendChild(playOverlay);
  }

  document.addEventListener("click", function (event) {
    const video = document.getElementById("myVideo");
    if (!video) return;

    if (!adOpened) {
      openAdOnce();
      playVideo();
      removePlayOverlay();
    }
  }, true);

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", createPlayOverlay);
  } else {
    createPlayOverlay();
  }
